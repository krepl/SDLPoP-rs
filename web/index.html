<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SDLPoP wasm (Worker harness, frames + audio + input)</title>
<style>
  body { background: #222; color: #eee; font-family: monospace; }
  canvas { image-rendering: pixelated; border: 1px solid #555; display: block; }
  #canvas-wrap { position: relative; display: inline-block; }
  #start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  #start-overlay .headline { font-size: 1.2em; margin-bottom: 0.4em; }
  #start-overlay .subtext { font-size: 0.85em; opacity: 0.75; }
</style>
</head>
<body>
<h3>SDLPoP wasm — Worker harness milestone: frames + audio + input</h3>
<div id="canvas-wrap">
  <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
  <div id="start-overlay">
    <div>
      <div class="headline">Click to play</div>
      <div class="subtext">(also enables audio and keyboard focus)</div>
    </div>
  </div>
</div>
<p id="status">starting worker&hellip;</p>
<p>Arrow keys / space / etc. to play. Open devtools console for log output.</p>
<script type="module">
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const status = document.getElementById('status');

  // Live input: a SharedArrayBuffer this page writes keyboard/mouse state into directly, and
  // the Worker's wasm side reads on every poll -- see set_shared_input_buffer's doc comment
  // (rust/src/lib.rs) and platform::wasm's "Live input" section for why a SharedArrayBuffer
  // (not postMessage) is the mechanism, and why this is a deliberate first-pass choice, not
  // the intended long-term shape. Requires cross-origin isolation (COOP/COEP response
  // headers) -- see scripts/build_wasm.sh's serving instructions.
  if (typeof SharedArrayBuffer === 'undefined') {
    status.textContent =
      'SharedArrayBuffer is unavailable -- this page must be served with ' +
      'Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp ' +
      '(see scripts/build_wasm.sh).';
    throw new Error('SharedArrayBuffer unavailable');
  }
  const INPUT_BUFFER_SIZE = 521; // 512 key-state bytes + mouse x/y (i32 each) + button bitmask
  const sharedInput = new SharedArrayBuffer(INPUT_BUFFER_SIZE);
  const keyState = new Uint8Array(sharedInput, 0, 512);
  const mouseView = new DataView(sharedInput, 512, 9);

  // Standard SDL2 scancodes (USB HID usage IDs) for the keys this game's controls actually
  // use, keyed by the physical-key identifier browsers report in KeyboardEvent.code (layout-
  // independent, unlike .key). Extend as more keys turn out to matter.
  const SCANCODE = {
    ArrowLeft: 80, ArrowRight: 79, ArrowUp: 82, ArrowDown: 81,
    Space: 44, Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Delete: 76,
    ShiftLeft: 225, ShiftRight: 229, ControlLeft: 224, ControlRight: 228,
    AltLeft: 226, AltRight: 230, Backquote: 53,
    F1: 58, F2: 59, F3: 60, F4: 61, F5: 62, F6: 63, F7: 64, F8: 65, F9: 66, F10: 67, F11: 68, F12: 69,
  };

  window.addEventListener('keydown', (e) => {
    const sc = SCANCODE[e.code];
    if (sc === undefined) return;
    e.preventDefault(); // stop arrow keys/space from scrolling the page, etc.
    keyState[sc] = 1;
  });
  window.addEventListener('keyup', (e) => {
    const sc = SCANCODE[e.code];
    if (sc === undefined) return;
    e.preventDefault();
    keyState[sc] = 0;
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) * (canvas.width / rect.width));
    const y = Math.round((e.clientY - rect.top) * (canvas.height / rect.height));
    mouseView.setInt32(0, x, true);
    mouseView.setInt32(4, y, true);
  });
  function setMouseButton(e, down) {
    const bit = e.button === 0 ? 1 : e.button === 2 ? 2 : 0;
    if (!bit) return;
    const cur = mouseView.getUint8(8);
    mouseView.setUint8(8, down ? (cur | bit) : (cur & ~bit));
  }
  canvas.addEventListener('mousedown', (e) => setMouseButton(e, true));
  canvas.addEventListener('mouseup', (e) => setMouseButton(e, false));
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Real Web Audio API playback of PCM chunks posted from the Worker (see pump_audio /
  // post_audio_to_js in rust/src/platform/wasm.rs). Chunks are scheduled back-to-back via
  // AudioBufferSourceNode, tracking a running "next chunk start time" cursor -- the standard
  // gap-free-streaming pattern for Web Audio without ScriptProcessorNode/AudioWorklet.
  let audioCtx = null;
  let nextPlayTime = 0;
  let audioChunksReceived = 0;
  window.audioChunksReceived = () => audioChunksReceived;

  function ensureAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      nextPlayTime = audioCtx.currentTime;
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // One click both enables audio (the required user gesture) and focuses the canvas for
  // keyboard input -- previously two separate, easy-to-miss steps (a small "Enable audio"
  // button off to the side, plus a written instruction to click the canvas first).
  const startOverlay = document.getElementById('start-overlay');
  startOverlay.addEventListener('click', () => {
    ensureAudioContext();
    canvas.focus();
    startOverlay.style.display = 'none';
  });

  function playPcmChunk(freq, channels, bytesPerSample, pcm) {
    // Browsers block audio until a user gesture resumes the context (the start overlay's
    // click handler); until then, silently drop chunks rather than queuing an ever-growing
    // backlog.
    if (!audioCtx || audioCtx.state !== 'running') return;
    const frameCount = Math.floor(pcm.length / (channels * bytesPerSample));
    if (frameCount === 0) return;
    const buffer = audioCtx.createBuffer(channels, frameCount, freq);
    for (let ch = 0; ch < channels; ch++) {
      const out = buffer.getChannelData(ch);
      for (let i = 0; i < frameCount; i++) {
        const offset = (i * channels + ch) * bytesPerSample;
        if (bytesPerSample === 2) {
          let sample = pcm[offset] | (pcm[offset + 1] << 8);
          if (sample >= 0x8000) sample -= 0x10000;
          out[i] = sample / 32768;
        } else {
          out[i] = (pcm[offset] - 128) / 128;
        }
      }
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    const startAt = Math.max(nextPlayTime, audioCtx.currentTime);
    source.start(startAt);
    nextPlayTime = startAt + buffer.duration;
  }

  const worker = new Worker('./worker.js', { type: 'module' });
  // SharedArrayBuffers are passed by reference through postMessage (unlike ArrayBuffer,
  // which would need transferring/copying) -- both sides see the same underlying memory.
  worker.postMessage({ type: 'init', sharedInput });

  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'frame') {
      const { w, h, bpp, pixels } = msg;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      // The game's screen buffer is RGB24 (bpp=3, no alpha channel); ImageData always
      // wants RGBA, so expand it here rather than in the worker/wasm side.
      const rgba = new Uint8ClampedArray(w * h * 4);
      for (let i = 0, j = 0; i < pixels.length; i += bpp, j += 4) {
        rgba[j] = pixels[i];
        rgba[j + 1] = pixels[i + 1];
        rgba[j + 2] = pixels[i + 2];
        rgba[j + 3] = 255;
      }
      ctx.putImageData(new ImageData(rgba, w, h), 0, 0);
      status.textContent = `frame ${w}x${h}, bpp=${bpp}`;
    } else if (msg.type === 'audio') {
      audioChunksReceived++;
      playPcmChunk(msg.freq, msg.channels, msg.bytesPerSample, msg.pcm);
    } else if (msg.type === 'error') {
      status.textContent = `worker error: ${msg.message}`;
      console.error('worker error', msg.message);
    } else if (msg.type === 'status') {
      status.textContent = msg.message;
    }
  };

  worker.onerror = (e) => {
    status.textContent = `worker crashed: ${e.message}`;
    console.error('worker crashed', e);
  };
</script>
</body>
</html>
