[package]
name = "sdlpop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prince"
path = "rust/src/main.rs"

[lib]
name = "sdlpop"
path = "rust/src/lib.rs"

[build-dependencies]
cc = "1"
bindgen = "0.70"
pkg-config = "0.3"

[dependencies]
sdl2 = { version = "0.38.0", features = ["image"] }
symphonia = "0.5.5"
