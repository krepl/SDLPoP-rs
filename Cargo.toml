[package]
name = "sdlpop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prince"
path = "rust/src/main.rs"

[lib]
name = "sdlpop"
path = "rust/src/lib.rs"

[build-dependencies]
cc = "1"
bindgen = "0.70"
pkg-config = "0.3"

[dependencies]
symphonia = "0.5.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["image"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData", "AudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "ScriptProcessorNode", "AudioContextOptions", "Performance",
    "Storage", "KeyboardEvent", "MouseEvent",
] }
console_error_panic_hook = "0.1"
