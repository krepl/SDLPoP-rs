[workspace]
members = [".", "xtask"]
# Plain `cargo build`/`cargo test --lib`/`cargo check --target wasm32-unknown-unknown` at the
# repo root (used throughout CLAUDE.md and by scripts/*.sh) should keep building only the
# `sdlpop` package, not `xtask` too.
default-members = ["."]

[package]
name = "sdlpop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prince"
path = "rust/src/main.rs"

[lib]
name = "sdlpop"
path = "rust/src/lib.rs"

[build-dependencies]
cc = "1"
bindgen = "0.70"
pkg-config = "0.3"

[dependencies]
symphonia = "0.5.5"
# Pure-Rust PNG decoder for WasmRenderer::load_image_from_file/load_image_from_memory --
# unconditional (not wasm32-only) because platform::wasm is also compiled on native under
# `cargo test` (Phase A). Vetted before adding: image-rs org (maintains the `image` crate),
# 0 unsafe code in the crate itself, 0 cargo-audit vulnerabilities across its full resolved
# dependency tree, confirmed wasm32-unknown-unknown buildable using the pure-Rust
# miniz_oxide DEFLATE backend (no C zlib dependency).
png = "0.18.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "0.38.0", features = ["image"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData", "AudioContext", "AudioBuffer", "AudioBufferSourceNode",
    "ScriptProcessorNode", "AudioContextOptions", "Performance",
    "Storage", "KeyboardEvent", "MouseEvent",
    # Origin Private File System (OPFS) -- real, synchronous file I/O from inside a Worker,
    # used to persist quicksave/PRINCE.SAV/PRINCE.HOF/SDLPoP.cfg across page reloads
    # (rust/src/wasm_persist.rs). FileSystemSyncAccessHandle's read/write/truncate/flush are
    # genuinely synchronous (unlike IndexedDB), which is what makes this fit the existing
    # blocking-call-inside-a-Worker architecture with no Atomics/second-Worker plumbing.
    "WorkerGlobalScope", "WorkerNavigator", "StorageManager", "FileSystemDirectoryHandle",
    "FileSystemFileHandle", "FileSystemGetFileOptions", "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
] }
console_error_panic_hook = "0.1"
